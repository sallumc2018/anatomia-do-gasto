name: Quality Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-governance:
    name: Python, scope, publication and review gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # As 24 suites de teste do repo nunca rodaram em CI nem no gate de push
      # (o .omega-gate-check condicionava a um diretorio `tests/` que nao existe).
      # Executadas pela primeira vez em 15/08/2026: 49 passaram.
      #
      # Instala o conjunto MINIMO, nao o requirements.txt inteiro: as suites sao
      # de contrato, chave e gate — nao tocam rede, pandas, PyMuPDF nem
      # playwright. O minimo foi medido, nao estimado: com apenas pytest a
      # coleta falha em test_baixar_emendas_federais.py com
      # "No module named 'tenacity'", e esse e o unico faltante. Verificado num
      # venv limpo: pytest + tenacity -> 49 passed.
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --quiet pytest==9.1.1 tenacity==9.1.4

      - name: Unit tests
        run: python -m pytest -q pipelines/testes tools/gates tools/security tools/server

      - name: Memory validation
        run: python tools/agents/validate-area.py --area memory

      - name: Agent contract validation
        run: python tools/agents/validate-area.py --area agents

      - name: Scope gates
        run: python tools/agents/validate-area.py --area scope

      - name: Publication gates
        run: python tools/agents/validate-area.py --area publication

      - name: Peer review readiness
        run: python tools/agents/validate-area.py --area review

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
