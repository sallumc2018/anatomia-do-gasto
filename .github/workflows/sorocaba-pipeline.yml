name: Piloto manual PNCP Sorocaba

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a coletar (separados por espaco)"
        required: false
        default: "2022 2023 2024 2025 2026"

permissions:
  contents: read

concurrency:
  group: pncp-sorocaba
  cancel-in-progress: false

jobs:
  coletar-pncp:
    name: Coletar e validar PNCP
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 2. Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Instalar dependencias Python
        run: |
          python -m pip install -r requirements.txt

      - name: 4. Instalar navegador Chromium do Playwright
        run: python -m playwright install chromium --with-deps

      - name: 5. Coletar PNCP via Playwright
        env:
          MUNICIPIO: "sorocaba"
          INPUT_ANOS: ${{ github.event.inputs.anos }}
        run: |
          ANOS="$(
            python tools/security/validate-workflow-years.py \
              "$INPUT_ANOS" \
              --default "2022 2023 2024 2025 2026"
          )"
          read -r -a ANOS_ARGS <<< "$ANOS"
          echo "Coletando anos: $ANOS"
          python pipelines/baixar_pncp_playwright.py \
            --tipo todos \
            --anos "${ANOS_ARGS[@]}"

      - name: 6. Gerar CSV local de publicacao
        env:
          MUNICIPIO: "sorocaba"
        run: python pipelines/gerar_pncp_publicacao.py

      - name: 7. Verificar mudancas locais sem commitar
        run: |
          if git diff --quiet -- data/public/sorocaba/contratos/saida/pncp_sorocaba_2022_2026.csv; then
            echo "Nenhuma mudanca no CSV do PNCP."
            exit 0
          fi
          echo "PNCP mudou no checkout efemero. Reproduza localmente, valide e commite pelo fluxo normal."
          git diff --stat -- data/public/sorocaba/contratos/saida/pncp_sorocaba_2022_2026.csv
